[package]
name = "serial-gateway"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cdefmt-decoder = { path = "../decoder", version = "0.4.0" }
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
cobs2 = "0.1.4"
mio-serial= "5.0.6"
mio = { version = ">=1", features = ["net"] }
